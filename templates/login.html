<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - HCP BI Platform</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:400px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#1b5e20;
            margin-bottom:30px;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#1b5e20;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#2e7d32;
        }

        .flash{
            color:red;
            text-align:center;
            margin-bottom:15px;
        }
    </style>

</head>
<body>

<div class="login-box">

    <h2>HCP BI Platform</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label>Nom d'utilisateur</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Mot de passe</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

</div>

</body>
</html>
